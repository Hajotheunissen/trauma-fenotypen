<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trauma Phenotypes – AZ09</title>
<style>
:root {
  --bg:#F8F7F4;--card:#FFFFFF;--primary:#7B8EA8;--primary-dark:#5A6F87;--primary-light:#EDF1F5;
  --purple:#9B8EC4;--purple-dark:#7B6FA8;--purple-light:#F0EDF7;
  --accent:#C4A882;--accent-light:#F5EDE4;--text:#3A3A3A;--text-light:#8A8A8A;--border:#ECEAE6;
  --shadow:0 1px 8px rgba(60,60,60,.04);--severity1:#A8B8C5;--severity2:#C4A882;--severity3:#B87A6A;
  --teal:#6BA3A0;--teal-dark:#4D8380;--teal-light:#EDF6F5;
  --radius:14px;--radius-sm:8px;--tr:.3s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;min-height:100vh}
#app{max-width:640px;margin:0 auto;padding:24px 20px 60px;overflow:hidden}
.header{text-align:center;padding:40px 0 4px}
.header h1{font-size:1.4rem;font-weight:600;color:var(--purple-dark);letter-spacing:-.3px}
.header .subtitle{font-size:.82rem;color:var(--text-light);margin-top:2px;letter-spacing:.5px;text-transform:uppercase}
.intro-card,.results-card,.transition-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 28px;margin-top:20px;animation:fadeIn .35s ease}
.question-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 28px;margin-top:12px}
.intro-card h2,.results-card h2,.transition-card h2{font-size:1.1rem;color:var(--purple-dark);margin-bottom:14px;font-weight:600}
.intro-card p,.transition-card p{font-size:.92rem;color:var(--text);margin-bottom:12px}
.intro-card ul{font-size:.88rem;color:var(--text-light);margin:8px 0 16px 18px}
.intro-card ul li{margin-bottom:6px}
.privacy-note{background:var(--purple-light);border-radius:var(--radius-sm);padding:14px 18px;font-size:.84rem;color:var(--purple-dark);margin-top:20px}
/* SLIDE ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideOutLeft{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-60px)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideOutRight{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(60px)}}
.question-card.slide-in{animation:slideInRight .35s ease both}
.question-card.slide-back{animation:slideInLeft .35s ease both}
.question-card.slide-out{animation:slideOutLeft .25s ease both;pointer-events:none}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 26px;border:none;border-radius:var(--radius-sm);font-size:.9rem;font-weight:600;cursor:pointer;transition:all var(--tr);outline:none}
.btn:focus-visible{box-shadow:0 0 0 3px rgba(155,142,196,.3)}
.btn-primary{background:var(--purple);color:#fff}
.btn-primary:hover{background:var(--purple-dark)}
.btn-secondary{background:var(--border);color:var(--text-light)}
.btn-secondary:hover{background:#dedad5}
.btn[disabled]{opacity:.3;cursor:default;pointer-events:none}
/* YES/NO/REVERSED */
.yesno-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.btn-yes,.btn-no,.btn-reversed{min-width:90px;padding:11px 22px;border:2px solid transparent;border-radius:var(--radius-sm);font-size:.9rem;font-weight:500;cursor:pointer;transition:all var(--tr)}
.btn-yes{background:var(--purple-light);color:var(--purple-dark);border-color:transparent}
.btn-yes:hover{border-color:var(--purple)}
.btn-yes.active{background:var(--purple);color:#fff;border-color:var(--purple);font-weight:700;box-shadow:0 0 0 3px rgba(155,142,196,.25)}
.btn-no{background:#f2f0ec;color:var(--text-light);border-color:transparent}
.btn-no:hover{border-color:#c9c5be}
.btn-no.active{background:#908a82;color:#fff;border-color:#908a82;font-weight:700;box-shadow:0 0 0 3px rgba(144,138,130,.25)}
.btn-reversed{background:var(--accent-light);color:#a07a50;border-color:transparent;font-size:.85rem}
.btn-reversed:hover{border-color:var(--accent)}
.btn-reversed.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;box-shadow:0 0 0 3px rgba(196,168,130,.25)}
/* PROGRESS */
.progress-container{margin:16px 0 4px}
.progress-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--primary));border-radius:2px;transition:width var(--tr)}
.progress-label{display:flex;justify-content:space-between;font-size:.75rem;color:var(--text-light);margin-top:5px}
/* QUESTION */
.question-id{display:inline-block;background:var(--purple);color:#fff;font-weight:700;font-size:.8rem;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;margin-bottom:14px}
.question-eng{font-size:.72rem;font-weight:500;color:var(--purple);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.question-title{font-size:.82rem;font-weight:500;color:var(--text-light);margin-bottom:10px}
.question-text{font-size:1.05rem;font-weight:500;color:var(--text);margin-bottom:24px;line-height:1.55}
/* HELP TIP */
.help-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);background:#FAFAFA;color:var(--text-light);font-size:.75rem;font-weight:700;cursor:pointer;transition:all var(--tr);vertical-align:middle;margin-left:6px;position:relative}
.help-btn:hover{border-color:var(--purple);color:var(--purple);background:var(--purple-light)}
.help-tip{display:none;position:absolute;top:30px;right:-8px;width:280px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;font-size:.82rem;font-weight:400;color:var(--text);line-height:1.55;box-shadow:0 4px 16px rgba(0,0,0,.1);z-index:10}
.help-tip.show{display:block}
/* AVATAR + COLLAPSIBLE BUBBLE */
.avatar-row{display:flex;gap:12px;margin-bottom:24px;align-items:flex-start}
.avatar-icon{flex-shrink:0;width:36px;height:36px;margin-top:1px}
.bubble-wrapper{flex:1}
.bubble-toggle{cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--purple);font-weight:500;padding:7px 14px;background:var(--purple-light);border-radius:20px;border:none;transition:all var(--tr);user-select:none}
.bubble-toggle:hover{background:#e4dff0}
.bubble-toggle .arrow{display:inline-block;transition:transform .3s ease;font-size:.65rem}
.bubble-toggle .arrow.open{transform:rotate(180deg)}
.bubble-content{max-height:0;overflow:hidden;transition:max-height .4s ease,opacity .3s ease;opacity:0}
.bubble-content.open{max-height:1200px;opacity:1}
.speech-bubble{background:#FAFAFA;border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin-top:10px;font-size:.85rem;color:var(--text);line-height:1.6}
.bubble-section{margin-bottom:12px}
.bubble-section:last-child{margin-bottom:0}
.bubble-section-title{font-weight:600;font-size:.78rem;color:var(--purple);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.bubble-parent-note{background:var(--purple-light);border-radius:6px;padding:10px 14px;margin:10px 0;font-size:.83rem;color:var(--purple-dark)}
.severity-list{list-style:none;margin-top:8px}
.severity-list li{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;font-size:.83rem}
.sev-symbol{font-weight:700;letter-spacing:1px;flex-shrink:0;min-width:36px}
.sev-symbol.s1{color:var(--severity1)}.sev-symbol.s2{color:var(--severity2)}.sev-symbol.s3{color:var(--severity3)}
/* MORE INFO within bubble */
.more-info-toggle{cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:.78rem;color:var(--purple);font-weight:500;padding:5px 12px;background:none;border:1px dashed var(--purple);border-radius:12px;margin-top:10px;transition:all var(--tr)}
.more-info-toggle:hover{background:var(--purple-light)}
.more-info-toggle .mi-arrow{display:inline-block;transition:transform .3s ease;font-size:.6rem}
.more-info-toggle .mi-arrow.open{transform:rotate(180deg)}
.more-info-content{max-height:0;overflow:hidden;transition:max-height .3s ease,opacity .2s ease;opacity:0;font-size:.83rem;color:var(--text);line-height:1.5}
.more-info-content.open{max-height:600px;opacity:1;padding-top:8px}
/* SUB OPTIONS */
.sub-options{animation:fadeIn .25s ease;margin-top:4px}
.option-group{margin-bottom:20px}
.option-label{font-size:.78rem;font-weight:500;color:var(--text-light);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.parent-btns,.severity-btns{display:flex;gap:8px;flex-wrap:wrap}
.parent-btn,.severity-btn{padding:9px 18px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:#fff;font-size:.88rem;font-weight:500;cursor:pointer;transition:all var(--tr);color:var(--text)}
.parent-btn:hover,.severity-btn:hover{border-color:var(--purple);background:var(--purple-light)}
.parent-btn.active{border-color:var(--purple);background:var(--purple);color:#fff}
.severity-btn{font-size:1rem;letter-spacing:2px;min-width:56px}
.severity-btn.s1{color:var(--severity1)}.severity-btn.s2{color:var(--severity2)}.severity-btn.s3{color:var(--severity3)}
.severity-btn.active.s1{border-color:var(--severity1);background:var(--severity1);color:#fff}
.severity-btn.active.s2{border-color:var(--severity2);background:var(--severity2);color:#fff}
.severity-btn.active.s3{border-color:var(--severity3);background:var(--severity3);color:#fff}
.reassurance{font-size:.8rem;color:var(--text-light);font-style:italic;margin-top:10px}
/* QUESTION FEEDBACK */
.q-feedback{margin-top:20px;padding-top:14px;border-top:1px solid var(--border)}
.q-feedback summary{font-size:.78rem;color:var(--text-light);cursor:pointer;user-select:none;list-style:none;display:flex;align-items:center;gap:4px}
.q-feedback summary::-webkit-details-marker{display:none}
.q-feedback summary .fb-arrow{font-size:.6rem;transition:transform .2s}
.q-feedback[open] summary .fb-arrow{transform:rotate(90deg)}
.q-feedback textarea{width:100%;min-height:54px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:.82rem;color:var(--text);resize:vertical;margin-top:8px;background:#FAFAFA;line-height:1.4}
.q-feedback textarea:focus{outline:none;border-color:var(--purple);background:#fff}
.q-feedback textarea::placeholder{color:var(--text-light)}
/* NAV */
.nav-row{display:flex;justify-content:space-between;margin-top:28px;padding-top:16px;border-top:1px solid var(--border)}
/* RESULTS */
.results-card h2{margin-bottom:16px}
.code-display{background:#2D3436;color:#DFE6E9;padding:18px 20px;border-radius:var(--radius-sm);font-family:'SF Mono','Fira Code',Consolas,monospace;font-size:1rem;letter-spacing:1px;word-break:break-all;margin-bottom:8px;position:relative}
.code-copy-btn{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.12);border:none;color:#DFE6E9;padding:4px 12px;border-radius:6px;font-size:.78rem;cursor:pointer;transition:background .2s}
.code-copy-btn:hover{background:rgba(255,255,255,.22)}
.code-legend{font-size:.78rem;color:var(--text-light);margin-bottom:24px;line-height:1.6}
.summary-section-title{font-size:.95rem;font-weight:700;color:var(--purple-dark);margin:20px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--purple-light)}
.summary-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.summary-item:last-child{border-bottom:none}
.summary-id{display:inline-flex;align-items:center;justify-content:center;background:var(--purple);color:#fff;font-weight:700;font-size:.78rem;width:28px;height:28px;border-radius:50%;flex-shrink:0}
.summary-info{flex:1}
.summary-name{font-weight:600;font-size:.9rem;color:var(--text)}
.summary-eng{font-size:.75rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.3px}
.summary-detail{font-size:.83rem;color:var(--text-light);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.severity-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.78rem;font-weight:600;color:#fff;letter-spacing:1px}
.severity-badge.s1{background:var(--severity1)}.severity-badge.s2{background:var(--severity2)}.severity-badge.s3{background:var(--severity3)}
.parent-badge,.reversed-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.78rem;font-weight:500}
.parent-badge{background:var(--purple-light);color:var(--purple-dark)}
.reversed-badge{background:var(--accent-light);color:#a07a50}
.empty-note{text-align:center;padding:32px 16px;color:var(--text-light);font-size:.93rem}
.results-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
/* VISUAL CODES */
.visual-codes{display:flex;gap:28px;align-items:flex-start;justify-content:center;margin:20px 0;flex-wrap:wrap}
.totem-container,.qr-container{display:flex;flex-direction:column;align-items:center;gap:8px}
.totem-container svg{filter:drop-shadow(0 2px 8px rgba(0,0,0,.08))}
.visual-label{font-size:.7rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
/* SUGGESTIONS */
.suggestions-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.suggestions-section label{font-size:.88rem;font-weight:600;color:var(--text);display:block;margin-bottom:8px}
.suggestions-section textarea{width:100%;min-height:80px;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:.88rem;color:var(--text);resize:vertical;transition:border-color var(--tr);background:#FAFAFA;line-height:1.5}
.suggestions-section textarea:focus{outline:none;border-color:var(--purple);background:#fff}
.suggestions-section textarea::placeholder{color:var(--text-light)}
/* TRANSITION */
.transition-card{text-align:center;padding:40px 28px}
.transition-card h2{font-size:1.2rem;margin-bottom:16px}
.transition-card p{max-width:480px;margin:0 auto 10px}
/* SOMATIC THEME OVERRIDES */
.somatic .question-id{background:var(--teal)}
.somatic .question-eng{color:var(--teal)}
.somatic .bubble-toggle{color:var(--teal);background:var(--teal-light)}
.somatic .bubble-toggle:hover{background:#d5ecea}
.somatic .bubble-section-title{color:var(--teal)}
.somatic .btn-yes{background:var(--teal-light);color:var(--teal-dark)}
.somatic .btn-yes:hover{border-color:var(--teal)}
.somatic .btn-yes.active{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 0 0 3px rgba(107,163,160,.25)}
.somatic .progress-fill{background:linear-gradient(90deg,var(--teal),var(--teal-dark))}
/* DIAGNOSES CHECKLIST */
.diagnosis-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.diagnosis-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#FAFAFA;border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all var(--tr);font-size:.88rem;user-select:none}
.diagnosis-item:hover{border-color:var(--teal);background:var(--teal-light)}
.diagnosis-item.checked{border-color:var(--teal);background:var(--teal-light);font-weight:600}
.diagnosis-check{width:20px;height:20px;border:2px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all var(--tr);font-size:.7rem;color:transparent}
.diagnosis-item.checked .diagnosis-check{border-color:var(--teal);background:var(--teal);color:#fff}
.diagnosis-label{flex:1}
.skip-link{display:inline-block;font-size:.85rem;color:var(--text-light);text-decoration:underline;cursor:pointer;margin-top:8px;transition:color var(--tr)}
.skip-link:hover{color:var(--purple)}
@media(max-width:520px){
  #app{padding:16px 10px 40px}
  .question-card,.intro-card,.results-card,.transition-card{padding:20px 16px}
  .diagnosis-grid{grid-template-columns:1fr}
  .speech-bubble{padding:12px 14px}
  .yesno-row{flex-direction:column;gap:8px}
  .btn-yes,.btn-no,.btn-reversed{width:100%}
  .parent-btns,.severity-btns{flex-direction:column}
  .parent-btn,.severity-btn{width:100%;text-align:center}
}
/* ═══ INTRO HERO SCENE ═══ */
.intro-scene{min-height:100vh;background:#080C14;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0;position:relative;overflow:hidden}
.intro-scene *{box-sizing:border-box}
/* iris / eye glow — electric blue like the book cover */
.intro-iris{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:460px;height:460px;pointer-events:none;z-index:0}
/* outer diffuse glow */
.intro-iris::before{content:'';position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,rgba(42,96,200,.18) 0%,rgba(28,70,160,.08) 40%,transparent 70%)}
/* iris ring gradient */
.intro-iris .iris-body{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#04060C 0%,#04060C 15%,#0E2460 25%,#1844A8 38%,#2660C8 48%,#1A3E90 58%,#0A1840 68%,transparent 78%)}
/* iris radial lines — rendered as SVG */
.intro-iris svg{position:absolute;inset:0;width:100%;height:100%;opacity:.3}
/* pupil */
.intro-iris .pupil{position:absolute;width:18%;height:18%;background:radial-gradient(circle,#010308 60%,#081030 100%);border-radius:50%;top:41%;left:41%}
/* highlight dot */
.intro-iris .highlight{position:absolute;width:5%;height:5%;background:rgba(220,235,255,.8);border-radius:50%;top:32%;left:44%;box-shadow:0 0 12px 4px rgba(200,220,255,.4)}
/* small float dot */
.intro-iris .dot2{position:absolute;width:2%;height:2%;background:rgba(200,220,255,.5);border-radius:50%;top:45%;left:65%}
/* ambient background glow behind iris */
.intro-scene::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:500px;height:300px;background:radial-gradient(ellipse,rgba(30,80,180,.12) 0%,transparent 65%);pointer-events:none;z-index:0}
/* top ornament line */
.intro-ornament{width:50px;height:1px;background:linear-gradient(90deg,transparent,rgba(80,130,220,.35),transparent);margin:360px auto 28px;position:relative;z-index:1}
/* title */
.intro-title-block{text-align:center;position:relative;z-index:1;padding:0 24px}
.intro-title{font-family:Georgia,'Times New Roman',serif;font-size:2.4rem;font-weight:400;color:#E8E4DE;letter-spacing:2px;margin-bottom:6px}
.intro-title em{font-style:italic;color:#E8E4DE;font-weight:400}
.intro-subtitle-line{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:.7rem;letter-spacing:3.5px;text-transform:uppercase;color:rgba(140,165,220,.4);margin-bottom:0}
.intro-version{font-size:.65rem;color:rgba(140,165,220,.18);margin-top:4px;cursor:pointer;letter-spacing:1px}
/* divider */
.intro-divider{width:30px;height:1px;background:linear-gradient(90deg,transparent,rgba(80,130,220,.25),transparent);margin:26px auto}
/* content cards */
.intro-body{max-width:560px;width:100%;padding:0 28px;position:relative;z-index:1}
.intro-lead{font-family:Georgia,'Times New Roman',serif;font-size:1.02rem;color:rgba(220,216,210,.75);line-height:1.8;text-align:center;margin-bottom:28px;font-weight:400}
.intro-lead em{color:rgba(220,216,210,.95);font-style:italic}
.intro-card-dark{background:rgba(255,255,255,.02);border:1px solid rgba(60,100,180,.1);border-radius:10px;padding:24px 26px;margin-bottom:14px}
.intro-card-dark h3{font-family:Georgia,'Times New Roman',serif;font-size:.92rem;font-weight:400;color:rgba(200,215,240,.75);margin-bottom:12px;letter-spacing:.3px}
.intro-card-dark p{font-size:.87rem;color:rgba(180,185,200,.5);line-height:1.7;margin-bottom:10px}
.intro-card-dark p:last-child{margin-bottom:0}
.intro-card-dark ul{list-style:none;margin:0;padding:0}
.intro-card-dark ul li{font-size:.87rem;color:rgba(180,185,200,.45);padding:6px 0;padding-left:20px;position:relative;line-height:1.55}
.intro-card-dark ul li::before{content:'·';position:absolute;left:4px;color:rgba(80,130,220,.4);font-size:1.2rem;line-height:1.3}
.intro-card-dark ul li strong{color:rgba(200,215,240,.7);font-weight:600}
.intro-card-dark .sev-dots{display:inline}
.intro-card-dark .sev-dots .s1{color:var(--severity1)}.intro-card-dark .sev-dots .s2{color:var(--severity2)}.intro-card-dark .sev-dots .s3{color:var(--severity3)}
/* perspective note */
.intro-note{background:rgba(40,80,180,.06);border-left:2px solid rgba(60,110,200,.2);border-radius:0 8px 8px 0;padding:14px 18px;margin-bottom:14px;font-size:.84rem;color:rgba(180,185,200,.5);line-height:1.6}
.intro-note strong{color:rgba(200,215,240,.7)}
/* privacy */
.intro-privacy{background:rgba(40,80,180,.04);border:1px solid rgba(60,100,180,.08);border-radius:8px;padding:14px 18px;margin-bottom:24px;font-size:.82rem;color:rgba(160,170,195,.35);line-height:1.55}
.intro-privacy strong{color:rgba(180,190,215,.5)}
/* start button */
.intro-start{text-align:center;margin:8px 0 48px;position:relative;z-index:1}
.btn-start{display:inline-block;padding:14px 48px;background:transparent;color:rgba(200,215,240,.8);font-family:Georgia,'Times New Roman',serif;font-size:.92rem;font-weight:400;letter-spacing:2px;border:1px solid rgba(60,110,200,.25);border-radius:6px;cursor:pointer;transition:all .4s cubic-bezier(.4,0,.2,1)}
.btn-start:hover{background:rgba(40,90,200,.08);border-color:rgba(80,140,230,.4);color:#E8E4DE;box-shadow:0 0 40px rgba(40,90,200,.12);transform:translateY(-1px)}
/* bottom ornament */
.intro-bottom-ornament{width:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(80,130,220,.15),transparent);margin:0 auto 32px;position:relative;z-index:1}
/* responsive */
@media(max-width:520px){
  .intro-iris{width:300px;height:300px;top:-20px}
  .intro-ornament{margin:240px auto 24px}
  .intro-title{font-size:1.8rem;letter-spacing:1px}
  .intro-body{padding:0 16px}
  .intro-card-dark{padding:18px 18px}
  .intro-lead{font-size:.92rem}
}
/* ═══ CELEBRATION SCREEN ═══ */
.celebration{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;animation:fadeIn .6s ease}
.celebration .cele-icon{font-size:4rem;margin-bottom:20px;animation:celebPulse 2s ease-in-out infinite}
.celebration h2{font-size:1.4rem;font-weight:600;color:var(--purple-dark);margin-bottom:12px}
.celebration p{font-size:.95rem;color:var(--text);max-width:420px;line-height:1.65;margin-bottom:8px}
.celebration .cele-sub{font-size:.85rem;color:var(--text-light);margin-top:8px}
.celebration .btn{margin-top:28px}
@keyframes celebPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
/* floating particles */
.cele-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cele-particle{position:absolute;border-radius:50%;opacity:0;animation:celebFloat 3s ease-in-out forwards}
@keyframes celebFloat{0%{opacity:0;transform:translateY(40px) scale(0)}20%{opacity:.7;transform:translateY(0) scale(1)}80%{opacity:.5}100%{opacity:0;transform:translateY(-120px) scale(.5)}}
@media print{
  body{background:#fff}
  .nav-row,.results-actions,.btn,.progress-container,.bubble-toggle,.avatar-row,.suggestions-section{display:none!important}
}
/* LANGUAGE SWITCH */
.lang-switch{position:fixed;top:14px;right:14px;z-index:999;display:flex;gap:6px;align-items:center;text-decoration:none}
.lang-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border:1.5px solid var(--border);border-radius:20px;background:var(--card);font-size:.78rem;font-weight:500;color:var(--text-light);cursor:pointer;transition:all var(--tr);text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.lang-btn:hover{border-color:var(--purple);color:var(--purple);background:var(--purple-light)}
.lang-flag{font-size:1rem;line-height:1}
</style>
</head>
<body>
<a class="lang-switch" href="../" title="Schakel naar Nederlands"><div class="lang-btn"><span class="lang-flag">🇳🇱</span></div></a>
<div id="app"></div>
<script>
// ═══════════════════════════════════════════════════════════════
// DATA: Questions A-Z (Determinants) + 0-9 (Coping Mechanisms)
// ═══════════════════════════════════════════════════════════════
const questions = [
// ─── A-M ────────────────────────────────────────────────────
{id:'A',eng:'Addiction',title:'Addiction',hasParent:true,hasReversed:false,
question:'Was one of your parents or caregivers addicted to substances or behaviors (e.g., alcohol, drugs, gambling, work)?',
toelichting:'This covers all forms of addiction in your caregivers. It doesn\'t have to be an official diagnosis — it\'s about the effect it had on you as a child.',
ouderHelp:'Choose which parent was affected by the addiction, or "both" if both parents struggled with this.',
s1:'You noticed something was going on, but generally still felt safe and seen at home. The addiction was present but didn\'t dominate.',
s2:'The addiction clearly affected the atmosphere at home — your parent was less available to you, you felt insecure or shortchanged by their preoccupation, or you were left to fend for yourself more often.',
s3:'The addiction dominated your entire childhood. Your parent was barely there for you — whether through absence, unpredictability, or neglect. You consistently felt unsafe or unimportant.'},

{id:'B',eng:'Bullying',title:'Bullying',hasParent:false,hasReversed:false,
question:'Were you systematically bullied by peers as a child?',
toelichting:'This is about being repeatedly bullied at school, in your neighborhood, or online. Not a one-time incident, but a pattern that affected you.',
s1:'You were teased or excluded and it hurt, but you could usually still cope with it.',
s2:'The bullying was prolonged and deeply affected you — you felt unsafe, different, or went to school with anxiety.',
s3:'The bullying was overwhelming and all-consuming. You felt completely alone, worthless, and saw no way out.'},

{id:'C',eng:'Caregiver Reliability',title:'Caregiver Reliability',hasParent:true,hasReversed:false,
question:'Were your caregivers unreliable or unpredictable when you needed them?',
toelichting:'This is about the foundation of safety: could you count on your parent being there when you needed them? This can also be about a parent who was physically present but mentally absent — lost in thought, emotionally unreachable, or so preoccupied with themselves that you didn\'t really matter.',
ouderHelp:'Choose which parent was most unreliable, or "both".',
s1:'Your parent wasn\'t always fully there, but you generally felt supported.',
s2:'You regularly felt let down or couldn\'t predict whether your parent would be there — even when they were physically in the house.',
s3:'You consistently felt unsupported. You learned early on that you could only rely on yourself.',
moreInfo:'Also think of: a parent always on their phone, a parent who was home but emotionally "gone," mood swings that left you never knowing what to expect, or promises that were repeatedly broken.'},

{id:'D',eng:'Divorce',title:'Divorce',hasParent:false,hasReversed:false,
question:'Did your parents go through a divorce or major relationship breakup?',
toelichting:'This is about your parents\' separation and how it affected you. Also consider the period before and after, loyalty conflicts, or loss of contact.',
s1:'The divorce was noticeable but you didn\'t feel like the center of the conflict.',
s2:'The divorce deeply affected you — you felt torn, guilty, or partially lost contact with a parent.',
s3:'The divorce was traumatic. You felt like a pawn and your sense of safety was deeply damaged.'},

{id:'E',eng:'Education',title:'School Problems',hasParent:false,hasReversed:false,
question:'Did you have major difficulties or frequent changes in your school career?',
toelichting:'This is about problems with school: frequent changes, learning difficulties that went unnoticed, or an environment where learning wasn\'t encouraged.',
s1:'You sometimes struggled at school, but didn\'t feel very different from others.',
s2:'School problems were a recurring theme — you felt stupid, unseen, or kept getting uprooted by changes.',
s3:'School was a source of constant stress. You felt hopelessly disadvantaged or completely lost in the system.',
moreInfo:'Also think of: being held back a year, special education, homeschooling, truancy, being bullied at school (see also B), learning difficulties like dyslexia that went unrecognized, or parents who didn\'t value education.'},

{id:'F',eng:'Financial Instability',title:'Financial Instability',hasParent:false,hasReversed:true,
reversedLabel:'Reversed — material abundance instead',
question:'Did you grow up in a financially unstable family?',
toelichting:'This is about the impact of financial hardship on you as a child. Think of debts, scarcity, or the constant tension around money.',
s1:'You noticed that money was sometimes a concern, but your basic needs were met.',
s2:'Financial stress was clearly felt — you were ashamed, couldn\'t participate, or felt the tension around money.',
s3:'Poverty dominated your childhood. You felt deprived of basic needs and the sense of scarcity was all-consuming.',
reversedInfo:'The reverse: you grew up with abundance, but money was used as a substitute for attention, as a tool of power, or you were so materially spoiled that it affected your development.'},

{id:'G',eng:'Grief',title:'Loss and Grief',hasParent:false,hasReversed:false,
question:'Did you experience a significant loss or grief as a child?',
toelichting:'This is about the loss of a loved one (parent, sibling, grandparent, friend), but also loss of your home, your country, or something else that was very important to you.',
s1:'You experienced a loss that affected you, but you received support and had space to grieve.',
s2:'The loss had a major impact and there wasn\'t enough space to grieve. You felt alone with your sadness.',
s3:'An overwhelming loss that changed your world. You felt broken and no one could truly absorb your grief.'},

{id:'H',eng:'Health Issues',title:'Family Health Issues',hasParent:true,hasReversed:false,
parentLabel:'Who had the health problems?',
question:'Did a family member (parent, sibling) have serious physical or mental health problems?',
toelichting:'This is about serious health problems in a family member — not yourself. The impact on you differs: a sick parent affects you differently than a sick sibling. With a parent, you depend on someone who can\'t fully be there; with a sibling, you may carry extra worries or receive less attention.',
ouderHelp:'Choose "Father" or "Mother" if it was a parent, or "Both" if it was a sibling or multiple family members.',
s1:'There were health problems that were noticeable, but you still felt safe and the family could cope.',
s2:'The health problems had a clear impact — you worried a lot, had to adjust, and family life was disrupted.',
s3:'The health crisis dominated everything. You felt powerless, scared, or your childhood was completely overshadowed by your family member\'s illness.',
moreInfo:'Note: this question is specifically about health problems in a family member and the impact on you. The effect differs: a sick parent may be less able to care for you, a sick sibling may mean you receive less attention or carry too much responsibility. Your own childhood health is not being asked about here.'},

{id:'I',eng:'Intrusive Parenting',title:'Overprotective / Controlling',hasParent:true,hasReversed:false,
question:'Did a parent or caregiver give you little space? Think of: wanting to know everything, making choices for you, not letting you play or experiment, extreme worry, feeling monitored or smothered.',
toelichting:'This is about a parent who left too little room for your own development. Control, overprotection, and interference that went beyond caring — making you feel smothered or small.',
ouderHelp:'Choose the parent who was most intrusive or overprotective, or "both".',
s1:'Some protection that sometimes felt constraining, but you could mostly develop freely.',
s2:'Restrictive control in multiple areas — social contacts, choices, privacy — you regularly felt constrained.',
s3:'All-encompassing control: virtually no personal space, privacy, or autonomy in any area.'},

{id:'J',eng:'Judgmental Environment',title:'Judgmental Environment',hasParent:true,hasReversed:false,
question:'Did you grow up in a strongly judgmental or critical environment?',
toelichting:'This is about an environment where judgment was always ready: about your appearance, achievements, choices, or who you were. You felt you were never good enough.',
ouderHelp:'Choose the parent who was most judgmental or critical, or "both".',
s1:'There was sometimes hurtful criticism, but you also felt appreciation and acceptance.',
s2:'Judgment was a fixed pattern — you rarely felt good enough and constantly adjusted your behavior to avoid criticism.',
s3:'You felt constantly judged and rejected. Nothing was ever good enough, and you began to see yourself through the eyes of that criticism.'},

{id:'K',eng:'Kinship Dysfunction',title:'Favoritism / Inequality',hasParent:true,hasReversed:true,
reversedLabel:'Reversed — I was actually the favorite',
question:'Was there unequal treatment or favoritism between children in your family?',
toelichting:'This is about imbalance in the family: one child gets more attention, praise, or privileges than another. You may have been seen as the problem child while another was the star — or vice versa.',
ouderHelp:'Choose the parent who most clearly showed favoritism, or "both".',
s1:'There was sometimes a difference in treatment that you noticed, but it didn\'t feel structurally hurtful.',
s2:'The inequality was painful and clearly felt — you felt worth less than a sibling.',
s3:'Extreme inequality. You felt invisible, rejected, or structurally less than others in your family.',
reversedInfo:'The reverse: you were the favorite. That may sound nice, but it can create pressure, cause guilt, and seriously strain your relationship with siblings.'},

{id:'L',eng:'Lack of Affection',title:'Lack of Warmth',hasParent:true,hasReversed:false,
question:'Did you experience a lack of warmth, love, or physical affection from a caregiver?',
toelichting:'This is about missing warmth: hugs, comfort, kind words, the feeling of being welcome and wanted. Sometimes there were gestures, but they didn\'t feel genuine.',
ouderHelp:'Choose the parent from whom you missed warmth the most, or "both".',
s1:'You sometimes missed warmth, but at other times you did feel you belonged.',
s2:'The lack of warmth was a recurring feeling — even when there were words or gestures, it didn\'t always feel real, or the warmth didn\'t feel genuine.',
s3:'You consistently felt unloved, unwanted, or unwelcome. The absence of real warmth was a constant in your childhood.'},

{id:'M',eng:'Manipulation',title:'Manipulation',hasParent:true,hasReversed:false,
question:'Were you manipulated or emotionally pressured by a parent?',
toelichting:'This is about a parent who instilled guilt, played you against the other parent, used emotional blackmail, or made you responsible for their feelings.',
ouderHelp:'Choose the parent who was most manipulative, or "both".',
s1:'Your parent sometimes used emotional pressure, but you could usually recognize it and it was incidental.',
s2:'Manipulation was a clear pattern — you often felt guilty, responsible for your parent\'s emotions, or were played against others.',
s3:'You constantly felt trapped in a web of emotional manipulation. You no longer knew what was real and your behavior was driven by your parent\'s whims.'},

// ─── N-Z ────────────────────────────────────────────────────
{id:'N',eng:'Narcissism',title:'Parental Narcissism',hasParent:true,hasReversed:false,
question:'Did one of your parents have strong narcissistic traits?',
toelichting:'This is about a parent for whom everything revolved around themselves: little empathy, need for admiration, hypersensitive to criticism. Your needs were secondary.',
ouderHelp:'Choose the parent with the strongest narcissistic traits, or "both".',
s1:'Your parent was sometimes very self-focused, but there was also room for you.',
s2:'You regularly felt invisible next to your parent — your needs rarely counted and you had to constantly provide validation.',
s3:'You only existed as an extension of your parent. There was no room for your own identity, feelings, or needs.'},

{id:'O',eng:'Overburdening',title:'Parentification / Overburdening',hasParent:true,hasReversed:false,
question:'Did you have to carry too much responsibility as a child or take on the parental role?',
toelichting:'This is about parentification: caring for your parent(s), siblings, or the household as a child. You were the little adult — emotionally and/or practically.',
ouderHelp:'Choose the parent you had to care for most or whose tasks you took over, or "both".',
s1:'You sometimes had more tasks than peers, but you could also just be a child.',
s2:'You structurally carried too much responsibility — you felt burdened with worries that didn\'t match your age.',
s3:'You were essentially the parent. You felt the weight of the entire family on your shoulders and your own childhood was taken from you.'},

{id:'P',eng:'Physical Abuse',title:'Physical Abuse',hasParent:true,hasReversed:false,
parentLabel:'Who was the source of the violence?',
question:'Did you experience physical (non-sexual) abuse or rough violence from a caregiver?',
toelichting:'This is about physical violence: hitting, kicking, harsh punishment, confinement. It\'s about whether you felt physically unsafe.',
ouderHelp:'Choose the parent from whom the physical violence came, or "both".',
s1:'There was occasional rough treatment that affected you, but it wasn\'t structural.',
s2:'Physical violence was a recurring pattern — you were regularly afraid of your parent\'s physical reactions.',
s3:'You constantly felt physically unsafe. The violence was severe and the fear of it was a constant in your life.'},

{id:'Q',eng:'Quarreling',title:'Arguments and Conflict at Home',hasParent:false,hasReversed:false,
question:'Were you regularly witness to intense arguments or conflicts between your parents or other family members?',
toelichting:'This is about the atmosphere at home: arguments between your parents or other family members that you witnessed. This is not about aggression directed at you — that is asked later under Verbal Abuse (V). Here it\'s about the conflict around you.',
s1:'There were regular arguments that made you uncomfortable, but there were also calm periods.',
s2:'Conflicts were a fixed part of home life — you felt tense, unsafe, and tried to make yourself invisible.',
s3:'Home felt like a constant battlefield. You lived in permanent tension and fear of the next escalation.'},

{id:'R',eng:'Relocation',title:'Frequent Relocation',hasParent:false,hasReversed:false,
question:'Did you frequently move as a child, having to start over each time?',
toelichting:'This is about frequent moves that undermined your social life and sense of stability. Not about a single move, but about a pattern.',
s1:'You moved a few times and had to adjust, but kept finding your footing.',
s2:'The moves made it hard to feel at home anywhere. You often felt like the outsider.',
s3:'Constant moving made you feel like you belonged nowhere. Stable friendships were impossible and you felt uprooted.'},

{id:'S',eng:'Sexual Abuse',title:'Sexual Abuse',hasParent:true,hasReversed:false,
parentLabel:'Who was the perpetrator?',
question:'Did you experience physical sexual abuse as a child?',
toelichting:'This covers any form of unwanted sexual contact as a child. This is a sensitive topic — take your time and know that your answer is for you alone.',
ouderHelp:'Choose who the perpetrator was: your father, mother, or both.',
s1:'There was boundary-crossing behavior that made you uncomfortable and that you couldn\'t place as a child.',
s2:'There was sexual abuse that caused fear, shame, and confusion and damaged your sense of safety.',
s3:'You experienced severe or prolonged sexual abuse that had a deep impact on your sense of safety and self-worth.'},

{id:'T',eng:'Trauma Exposure',title:'Trauma Exposure',hasParent:false,hasReversed:false,
question:'Were you exposed to traumatic events as a child, such as accidents or violence?',
toelichting:'This is about direct exposure to shocking events: a serious accident, violence in your surroundings, a fire, or other impactful experiences.',
s1:'You experienced something shocking that affected you, but you could get through it.',
s2:'The traumatic experience had a lasting impact — you felt unsafe, had nightmares, or avoided certain situations.',
s3:'The exposure was overwhelming. You felt powerless and the fear or images haunted you for a long time.'},

{id:'U',eng:'Unavailability',title:'Parental Unavailability',hasParent:true,hasReversed:false,
question:'Were your parents or caregivers often unavailable due to work, personal activities, or other obligations?',
toelichting:'This is about parents who were structurally absent: always working, busy with other things, or simply not there. The difference from C (Caregiver Reliability) is that this is about pure availability — your parent simply wasn\'t there, regardless of the reason.',
ouderHelp:'Choose the parent who was most unavailable, or "both".',
s1:'Your parent was sometimes busy or absent, but there were also moments of attention and presence.',
s2:'The unavailability was structural — you regularly felt left alone and often had to figure things out yourself.',
s3:'Your parent was almost never available. You felt forgotten, unimportant, and learned to expect nothing.',
moreInfo:'The distinction from C (Caregiver Reliability): C is about whether your parent was predictable and emotionally reachable (even when physically present). U is specifically about physical absence — your parent simply wasn\'t there.'},

{id:'V',eng:'Verbal Abuse',title:'Verbal Abuse',hasParent:true,hasReversed:false,
question:'Was there verbal aggression directed specifically at you?',
toelichting:'This is about yelling, cursing, threatening, or belittling directed specifically at you. Not arguments between others — that is asked earlier under Quarreling (Q). Here it\'s about words used directly against you.',
ouderHelp:'Choose the parent from whom the verbal abuse came, or "both".',
s1:'Your parent sometimes said hurtful things, but it was incidental and there were also good moments.',
s2:'Verbal aggression was a fixed pattern — you walked on eggshells, never knew when it would come, and the words stayed with you.',
s3:'You were daily cursed at, threatened, or humiliated. The words deeply damaged your self-image.'},

{id:'W',eng:'Witnessing Domestic Abuse',title:'Witnessing Domestic Abuse',hasParent:true,hasReversed:false,
parentLabel:'Who was the aggressor?',
question:'Did you witness abuse or violence within your household?',
toelichting:'This is about seeing or hearing physical, emotional, or sexual violence between adults in your home. The difference from Q (Quarreling) is the severity: here it\'s about actual violence or abuse, not arguments or conflicts.',
ouderHelp:'Choose who primarily committed the violence.',
s1:'You occasionally experienced intense situations that made you anxious.',
s2:'You regularly witnessed violence — you felt powerless and tried to intervene or flee.',
s3:'You lived in constant fear of the violence. It fundamentally damaged your sense of safety.',
moreInfo:'The distinction from Q (Quarreling): Q is about conflicts and arguments (yelling, slamming doors, tension). W is specifically about violence and abuse — physical, emotional, or sexual — between adults in your household.'},

{id:'X',eng:'Adoption',title:'Adoption',hasParent:false,hasReversed:false,
question:'Were you adopted as a child?',
toelichting:'This is about the experience of being adopted: questions about identity, the feeling of not belonging, or missing biological roots.',
s1:'You were adopted and have questions about it, but it hasn\'t strongly affected your daily functioning.',
s2:'The adoption clearly affected you — identity questions, a sense of loss, or difficulty with attachment.',
s3:'The adoption experience left deep wounds: attachment issues, repeated rejection, or a deep sense of abandonment.'},

{id:'Y',eng:'Yoke',title:'Performance Pressure',hasParent:true,hasReversed:false,
question:'Were you put under heavy pressure to perform by a parent?',
toelichting:'This is about excessive pressure on your performance: school, sports, music, or other areas. Your worth depended on what you achieved — it felt like a yoke you carried.',
ouderHelp:'Choose the parent who exerted the most performance pressure, or "both".',
s1:'There were high expectations that sometimes felt heavy, but you also had room to make mistakes.',
s2:'Performance pressure was clearly felt — you only felt valued with good results and failure was not an option.',
s3:'Extreme pressure: your entire worth as a person depended on your achievements. The burden was crushing and you never felt good enough.'},

{id:'Z',eng:'Zero Boundaries',title:'Absent Boundaries',hasParent:true,hasReversed:false,
question:'Did you grow up in an environment with poor or absent boundaries?',
toelichting:'This is about an environment where boundaries were missing: no privacy, no respect for your space, inappropriate openness, or a parent who didn\'t respect normal boundaries. This can also be about a parent so absorbed in themselves that there was barely any supervision, correction, or parenting — a kind of "anything goes because no one is watching."',
ouderHelp:'Choose the parent where the lack of boundaries was strongest, or "both".',
s1:'There were sometimes situations where boundaries were vague, but you generally felt safe.',
s2:'The lack of boundaries was structurally felt — your privacy was not respected or you were exposed to things not appropriate for your age.',
s3:'There were virtually no boundaries. You felt exposed, unprotected, and there was no safe space that was truly yours.'},

// ─── 0-9: COPINGMECHANISMEN (heden, volwassene) ────────────
{id:'0',eng:'Intimacy Issues',title:'Intimacy Issues',hasParent:false,hasReversed:false,isCoping:true,
question:'Do you struggle with intimacy or fear of commitment in relationships?',
toelichting:'This is about your current experience with closeness and connection — not purely sexual. Do you feel uncomfortable with emotional or physical intimacy? This is a coping mechanism that may stem from your childhood experiences.',
s1:'You sometimes notice discomfort with intimacy, but you can generally connect with others.',
s2:'Intimacy often feels threatening — you withdraw, sabotage relationships, or keep people at a distance.',
s3:'True closeness feels impossible. You avoid deep connections or panic when someone gets too close.'},

{id:'1',eng:'Authority Issues',title:'Authority Issues',hasParent:false,hasReversed:false,isCoping:true,
question:'Do you currently struggle with authority figures?',
toelichting:'This is about your current relationship with authority: supervisors, rules, authority. Do you quickly feel threatened, defiant, or excessively compliant?',
s1:'You sometimes have friction with authority, but can generally deal with it.',
s2:'Authority triggers strong reactions — you become defiant, anxious, or excessively compliant.',
s3:'Dealing with authority figures is a major problem that seriously affects your functioning at work or in other situations.'},

{id:'2',eng:'Social Withdrawal',title:'Social Withdrawal',hasParent:false,hasReversed:false,isCoping:true,
question:'Do you tend to withdraw from social contacts?',
toelichting:'This is about your current social behavior. Do you regularly withdraw or avoid social situations, even when you actually want contact? This is not about consciously seeking quiet or rest (that\'s healthy) — but about withdrawal from fear, insecurity, or avoidance.',
s1:'You sometimes withdraw, but also have moments of contact and connection.',
s2:'Social withdrawal is a clear pattern — you avoid situations, cancel plans, or feel exhausted by contact.',
s3:'You live largely isolated. Social situations feel overwhelming and you have few to no close contacts.'},

{id:'3',eng:'Addiction Problems',title:'Own Addiction Issues',hasParent:false,hasReversed:false,isCoping:true,
question:'Do you have problems with addiction yourself (substances, behaviors, or habits)?',
toelichting:'This is about your own addiction patterns now. Think of heavier addictions (alcohol, drugs, medication, gambling), but also behavioral addictions (gaming, porn, shopping, excessive work or exercise). It\'s about patterns that negatively affect your life, not mild habits like coffee.',
s1:'You notice you sometimes do or use too much, but you can still control it and the impact is limited.',
s2:'The pattern is clearly present and affects your daily life, relationships, or health.',
s3:'The addiction dominates your life. You feel powerless to stop despite the consequences.',
moreInfo:'How do you assess the severity? Consider: how hard is it to stop? How big is the impact on your relationships, work, or health? A cigarette during stress is different from daily heavy drinking or being unable to function without gaming. Be honest about the degree to which the pattern affects your life.'},

{id:'4',eng:'Emotional Numbness',title:'Emotional Numbness',hasParent:false,hasReversed:false,isCoping:true,
question:'Do you often feel emotionally numb or shut down?',
toelichting:'This is about your current ability to feel emotions. Do you feel like your emotions are switched off? Do you feel little about things that affect others?',
s1:'You sometimes notice you feel less than expected, but you can generally experience emotions.',
s2:'Emotional numbness is a recognizable pattern — you often feel empty, shut down, or indifferent.',
s3:'You feel virtually nothing anymore. Emotions are shut off and you function on autopilot.'},

{id:'5',eng:'Overachievement',title:'Overachievement / Perfectionism',hasParent:false,hasReversed:false,isCoping:true,
question:'Do you tend to overachieve or be perfectionistic?',
toelichting:'This is about your current drive to perform. Do you use achievement or perfectionism to prove your worth or to avoid feelings?',
s1:'You are ambitious and sometimes too hard on yourself, but can also relax.',
s2:'Achievement is a driving force — you feel restless when not productive and rest feels like laziness.',
s3:'You are trapped in a cycle of achievement. Standing still feels unbearable and your self-worth depends entirely on your performance.'},

{id:'6',eng:'Trust Issues',title:'Trust Issues',hasParent:false,hasReversed:false,isCoping:true,
question:'Do you struggle to trust others?',
toelichting:'This is about your current ability to trust: friends, partners, colleagues. Do you always expect the worst?',
s1:'You are sometimes distrustful, but can build trust with the right people.',
s2:'Trust is a recurring problem — you often doubt others\' intentions and keep your heart closed.',
s3:'You trust virtually no one. The world feels unsafe and you are constantly on guard.'},

{id:'7',eng:'Anxiety & Panic',title:'Anxiety and Panic',hasParent:false,hasReversed:false,isCoping:true,
question:'Do you regularly experience anxiety or panic attacks?',
toelichting:'This is about your current experience with anxiety: excessive worrying, rumination, tension in your body, panic attacks, or a constant sense of unsafety.',

const app = () => document.getElementById('app');

function isComplete(qId) {
  const a = state.answers[qId];
  if (!a || a.present === undefined) return false;
  if (a.present === false) return true;
  if (a.present === 'reversed') return true; // no severity for reversed
  // Split severity for "beiden": need both severities
  if (a.parent === 'B') return !!(a.severityF && a.severityM);
  if (!a.severity) return false;
  return true;
}

function generateCode() {
  let code = '';
  // A-Z determinants
  for (const q of questions.filter(q => /^[A-Z]$/.test(q.id))) {
    const a = state.answers[q.id];
    if (!a || a.present === false) continue;
    code += q.id;
    if (a.present === 'reversed') code += 'r';
    if (a.parent === 'B' && a.severityF && a.severityM) {
      // Both with split severity: Amf23 = mother sev 2, father sev 3
      code += 'mf' + a.severityM + a.severityF;
    } else {
      if (a.parent === 'V') code += 'f';
      else if (a.parent === 'M') code += 'm';
      if (a.severity) code += a.severity;
    }
  }
  // 0-9 coping
  for (const q of questions.filter(q => /^[0-9]$/.test(q.id))) {
    const a = state.answers[q.id];
    if (!a || a.present === false) continue;
    code += q.id + a.severity;
  }
  // Somatic symptoms (s0-s9) + unexplained (u)
  for (const q of questions.filter(q => q.isSomatic)) {
    const a = state.answers[q.id];
    if (!a || a.present === false) continue;
    code += q.id + a.severity;
  }
  // Diagnoses (d0-d9)
  for (const d of diagnoses) {
    if (state.diagAnswers[d.id]) code += d.id;
  }
  return (code || '0') + '-0.6.1';
}

function parentLabel(p) { return p==='V'?'Father':p==='M'?'Mother':'Both'; }
function sevLabel(s) { return s===1?'●':s===2?'●●':'●●●'; }

// ═══════════════════════════════════════════════════════════════
// MINIMAL QR CODE GENERATOR (Alphanumeric, Version 1-4, EC-L)
// ═══════════════════════════════════════════════════════════════
const QR = (() => {
  const ALPH = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';
  // GF(256) for Reed-Solomon
  const EXP=new Uint8Array(512), LOG=new Uint8Array(256);
  let v=1;for(let i=0;i<255;i++){EXP[i]=v;LOG[v]=i;v=(v<<1)^(v&128?0x11d:0);}
  for(let i=255;i<512;i++)EXP[i]=EXP[i-255];

  function gfMul(a,b){return a&&b?EXP[LOG[a]+LOG[b]]:0;}

  function rsEC(data,ecLen){
    let gen=[1];
    for(let i=0;i<ecLen;i++){
      const ng=new Array(gen.length+1).fill(0);
      for(let j=0;j<gen.length;j++){ng[j]^=gen[j];ng[j+1]^=gfMul(gen[j],EXP[i]);}
      gen=ng;
    }
    const msg=new Uint8Array(data.length+ecLen);msg.set(data);
    for(let i=0;i<data.length;i++){
      const c=msg[i];if(c)for(let j=0;j<gen.length;j++)msg[i+j]^=gfMul(gen[j],c);
    }
    return Array.from(msg.slice(data.length));
  }

  // Version configs: [size, dataCodewords, ecCodewords, alignPos]
  const VER={1:[21,19,7,[]],2:[25,34,10,[18]],3:[29,55,15,[22]],4:[33,80,20,[26]]};

  function pickVersion(len){
    // Max alphanumeric chars per version-L
    const mx={1:25,2:47,3:77,4:114};
    for(let v=1;v<=4;v++)if(len<=mx[v])return v;
    return 4;
  }

  function encode(text){
    text=text.toUpperCase();
    const ver=pickVersion(text.length);
    const [sz,dataCW,ecCW,align]=VER[ver];

    // Build bit stream
    const bits=[];
    const pb=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>i)&1);};
    pb(0b0010,4); // Alphanumeric mode
    pb(text.length, ver<=9?9:11);
    for(let i=0;i<text.length;i+=2){
      const a=ALPH.indexOf(text[i]);
      if(i+1<text.length){pb(a*45+ALPH.indexOf(text[i+1]),11);}
      else{pb(a,6);}
    }
    pb(0,Math.min(4,dataCW*8-bits.length)); // Terminator
    while(bits.length%8)bits.push(0);

    // Convert to bytes, pad
    const data=[];
    for(let i=0;i<bits.length;i+=8)data.push(bits.slice(i,i+8).reduce((a,b)=>(a<<1)|b,0));
    const pads=[0xEC,0x11];let pi=0;
    while(data.length<dataCW)data.push(pads[pi++%2]);

    // Error correction
    const ec=rsEC(new Uint8Array(data),ecCW);
    const allBytes=[...data,...ec];

    // Build QR matrix
    const grid=Array.from({length:sz},()=>new Int8Array(sz)); // 0=white,1=black,-1=unset
    const reserved=Array.from({length:sz},()=>new Uint8Array(sz)); // 1=reserved

    function setMod(r,c,val){grid[r][c]=val?1:0;reserved[r][c]=1;}
    // Finder patterns
    function finder(r,c){
      for(let dr=-1;dr<=7;dr++)for(let dc=-1;dc<=7;dc++){
        const rr=r+dr,cc=c+dc;
        if(rr<0||rr>=sz||cc<0||cc>=sz)continue;
        const inOuter=dr===-1||dr===7||dc===-1||dc===7;
        const inRing=dr===0||dr===6||dc===0||dc===6;
        const inCore=dr>=2&&dr<=4&&dc>=2&&dc<=4;
        setMod(rr,cc,!inOuter&&(inRing||inCore)?1:0);
      }
    }
    finder(0,0);finder(0,sz-7);finder(sz-7,0);

    // Timing patterns
    for(let i=8;i<sz-8;i++){setMod(6,i,i%2===0?1:0);setMod(i,6,i%2===0?1:0);}

    // Alignment patterns
    for(const ar of align)for(const ac of align){
      if(reserved[ar][ac])continue;
      for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){
        setMod(ar+dr,ac+dc,(Math.abs(dr)===2||Math.abs(dc)===2||(!dr&&!dc))?1:0);
      }
    }
    // Single alignment for versions with one pos
    if(align.length===1){
      const ar=align[0];
      for(const pos of [[ar,ar]]){
        const[r2,c2]=pos;
        if(reserved[r2]&&reserved[r2][c2])continue;
        for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){
          const rr=r2+dr,cc=c2+dc;
          if(rr>=0&&rr<sz&&cc>=0&&cc<sz&&!reserved[rr][cc])
            setMod(rr,cc,(Math.abs(dr)===2||Math.abs(dc)===2||(!dr&&!dc))?1:0);
        }
      }
    }

    // Dark module + reserved format/version areas
    setMod(sz-8,8,1);
    for(let i=0;i<8;i++){reserved[8][i]=1;reserved[8][sz-1-i]=1;reserved[i][8]=1;reserved[sz-1-i][8]=1;}
    reserved[8][8]=1;

    // Place data bits
    const allBits=[];
    for(const b of allBytes)for(let i=7;i>=0;i--)allBits.push((b>>i)&1);

    let bi=0, upward=true;
    for(let right=sz-1;right>=1;right-=2){
      if(right===6)right=5; // Skip timing column
      const rows=upward?[...Array(sz).keys()].reverse():[...Array(sz).keys()];
      for(const row of rows){
        for(const col of [right,right-1]){
          if(col<0||reserved[row][col])continue;
          grid[row][col]=bi<allBits.length?allBits[bi++]:0;
        }
      }
      upward=!upward;
    }

    // Apply mask 0 (checkerboard: (row+col)%2===0)
    for(let r=0;r<sz;r++)for(let c=0;c<sz;c++){
      if(!reserved[r][c])grid[r][c]^=((r+c)%2===0)?1:0;
    }

    // Format info for EC-L, mask 0: precomputed = 0x77C4
    const fmt=0x77C4;
    for(let i=0;i<15;i++){
      const bit=(fmt>>i)&1;
      // Around top-left finder
      if(i<6)grid[i][8]=bit;
      else if(i===6)grid[7][8]=bit;
      else if(i===7)grid[8][8]=bit;
      else if(i===8)grid[8][7]=bit;
      else grid[8][14-i]=bit;
      // Other copies
      if(i<8)grid[8][sz-1-i]=bit;
      else grid[sz-15+i][8]=bit;
    }

    return {grid,sz};
  }

  function drawCanvas(canvas,text,moduleSize){
    moduleSize=moduleSize||4;
    const{grid,sz}=encode(text);
    const quiet=4;
    const total=(sz+quiet*2)*moduleSize;
    canvas.width=total;canvas.height=total;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,total,total);
    ctx.fillStyle='#2D3436';
    for(let r=0;r<sz;r++)for(let c=0;c<sz;c++){
      if(grid[r][c])ctx.fillRect((c+quiet)*moduleSize,(r+quiet)*moduleSize,moduleSize,moduleSize);
    }
  }

  return{encode,drawCanvas};
})();

// ═══════════════════════════════════════════════════════════════
// TOTEM GENERATOR
// ═══════════════════════════════════════════════════════════════
function generateTotemSVG() {
  const factors = [];
  // Only A-Z determinants and 0-9 coping — NO somatic, NO diagnoses
  for (const q of questions) {
    if (q.isSomatic) continue;
    const a = state.answers[q.id];
    if (!a || a.present === false) continue;
    factors.push({ id:q.id, sev:a.severity||0, par:a.parent, rev:a.present==='reversed', cop:!!q.isCoping });
  }
  if (!factors.length) return '';
  const n = factors.length;
  const segH = 22, gap = 2, padTop = 26, padBot = 18;
  const h = padTop + n*(segH+gap) + padBot;
  const cx = 70, maxW = 88, minW = 34;
  // Unique hue per factor (golden angle), severity = darkness
  const col = (id, sev) => {
    const idx = id.charCodeAt(0)>=65 ? id.charCodeAt(0)-65 : id.charCodeAt(0)-48+26;
    const hue = Math.round((idx*137.5)%360);
    const sat = sev===3?52:sev===2?46:sev===1?38:22;
    const lit = sev===3?42:sev===2?56:sev===1?66:72;
    return `hsl(${hue},${sat}%,${lit}%)`;
  };
  const bw = i => { const t=n>1?i/(n-1):.5; return Math.round(minW+(maxW-minW)*(.3+.7*Math.sin(t*Math.PI))); };

  let s = `<svg viewBox="0 0 140 ${h}" width="140" height="${h}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<defs><pattern id="th" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/></pattern></defs>`;

  // Crown
  const tw = bw(0)*.4;
  s += `<polygon points="${cx},3 ${cx-tw},${padTop} ${cx+tw},${padTop}" fill="#4A4A4A"/>`;
  let y = padTop;

  factors.forEach((f,i) => {
    const w = f.cop ? bw(i)*.6 : bw(i);
    const x = cx-w/2, c = col(f.id, f.sev), rx = f.cop ? segH/2 : 3;
    // Segment
    s += `<rect x="${x}" y="${y}" width="${w}" height="${segH}" rx="${rx}" fill="${c}" stroke="#3A3A3A" stroke-width=".7"/>`;
    // Hatching for reversed
    if (f.rev) s += `<rect x="${x}" y="${y}" width="${w}" height="${segH}" rx="${rx}" fill="url(#th)"/>`;
    // Notches on wider determinant segments
    if (!f.cop && w > 58) {
      s += `<rect x="${x-4}" y="${y+segH/2-4}" width="4" height="8" rx="1.5" fill="${c}" stroke="#3A3A3A" stroke-width=".5"/>`;
      s += `<rect x="${x+w}" y="${y+segH/2-4}" width="4" height="8" rx="1.5" fill="${c}" stroke="#3A3A3A" stroke-width=".5"/>`;
    }
    // Parent indicators: ♂ left for vader, ♀ right for moeder
    if (f.par==='V'||f.par==='B') s += `<text x="${x+7}" y="${y+segH/2+3.5}" text-anchor="middle" fill="rgba(255,255,255,.7)" font-size="8" font-weight="700">♂</text>`;
    if (f.par==='M'||f.par==='B') s += `<text x="${x+w-7}" y="${y+segH/2+3.5}" text-anchor="middle" fill="rgba(255,255,255,.7)" font-size="8" font-weight="700">♀</text>`;
    // Reversed indicator: R in corner
    if (f.rev) s += `<text x="${x+w-5}" y="${y+9}" text-anchor="end" fill="rgba(255,255,255,.6)" font-size="7" font-weight="700">R</text>`;
    // Letter
    s += `<text x="${cx}" y="${y+segH/2+4}" text-anchor="middle" fill="#fff" font-size="10" font-weight="700" font-family="-apple-system,system-ui,sans-serif">${f.id}</text>`;
    y += segH+gap;
  });

  // Base
  const baseW = bw(n-1)*.5;
  s += `<rect x="${cx-baseW/2}" y="${y+3}" width="${baseW}" height="10" rx="2" fill="#4A4A4A"/>`;
  s += '</svg>';
  return s;
}

    <p>At the same time, each completed code contributes to a larger whole. The more phenotypes are recorded, the better we as a society can understand which patterns lead to which complaints — and which help works best. Your code is yours. But the insight that comes from it, is for everyone.</p>

function renderCelebration() {
  // Generate soft floating particles
  const colors = ['var(--purple-light)','var(--purple)','var(--accent)','var(--primary-light)','var(--teal-light)'];
  let particles = '';
  for (let i = 0; i < 18; i++) {
    const c = colors[i % colors.length];
    const left = Math.round(Math.random() * 100);
    const top = 30 + Math.round(Math.random() * 50);
    const size = 6 + Math.round(Math.random() * 10);
    const delay = (Math.random() * 2).toFixed(1);
    particles += `<div class="cele-particle" style="left:${left}%;top:${top}%;width:${size}px;height:${size}px;background:${c};animation-delay:${delay}s"></div>`;
  }

  app().innerHTML = `
  <div style="position:relative">
    <div class="cele-particles">${particles}</div>
    <div class="celebration">
      <div class="cele-icon">&#10024;</div>
      <h2>Well done</h2>
      <p>You have honestly faced 26 questions. That takes courage — and you have shown it.</p>
      <p class="cele-sub">Take a moment. Breathe in, breathe out.</p>
      <button class="btn btn-primary" onclick="state.phase='transition';render();window.scrollTo({top:0,behavior:'smooth'})">Continue</button>
    </div>
  </div>`;
}

function renderQuestion() {

  const somaticStart = 36;
  const totalSomatic = questions.length - somaticStart;
  const displayIdx = isSomatic ? idx - somaticStart + 1 : idx + 1;
  const displayTotal = isSomatic ? totalSomatic : totalMain;
  const pct = Math.round(((isSomatic ? idx - somaticStart : idx) / displayTotal) * 100);
  const isRev = a.present === 'reversed';

  // Determine severity descriptions
  const sev1 = q.s1;
  const sev2 = q.s2;
  const sev3 = q.s3;

    </div>
    <div class="question-eng">${q.eng}</div>

                <li><span class="sev-symbol s2">●●</span><span>${sev2}</span></li>
                <li><span class="sev-symbol s3">●●●</span><span>${sev3}</span></li>

    <details class="q-feedback">
      <summary><span class="fb-arrow">▶</span> Suggestion to improve this question</summary>
      <p style="font-size:.8rem;color:var(--text-light);margin:8px 0 6px;line-height:1.5">We continuously try to improve this questionnaire. Your input helps us with that — thank you.</p>
      <textarea id="qFeedbackField" placeholder="What would you change about this question?" oninput="state.qFeedback['${q.id}']=this.value">${state.qFeedback[q.id]||''}</textarea>
    </details>

    <div class="nav-row">
      <button class="btn btn-secondary" ${idx===0?'disabled':''} onclick="prevQuestion()">Previous</button>
      <button class="btn btn-primary" ${canNext?'':'disabled'} onclick="nextQuestion()">Next</button>
    </div>
  </div>`;
  state.slideDir = null; // reset after render
}

function renderResults() {
  const code = generateCode();
  const activeDet = questions.filter(q=>/^[A-Z]$/.test(q.id)&&state.answers[q.id]&&state.answers[q.id].present!==false);
  const activeCop = questions.filter(q=>/^[0-9]$/.test(q.id)&&state.answers[q.id]&&state.answers[q.id].present!==false);
  const activeSom = questions.filter(q=>q.isSomatic&&state.answers[q.id]&&state.answers[q.id].present!==false);
  const activeDiag = diagnoses.filter(d=>state.diagAnswers[d.id]);

  function summaryItems(list) {
    if (!list.length) return '<div class="empty-note">No factors selected.</div>';
    return list.map(q => {
      const a = state.answers[q.id];
      const badges = [];
      if (a.present==='reversed') badges.push('<span class="reversed-badge">Reversed</span>');
      if (q.hasParent && a.parent) badges.push(`<span class="parent-badge">${parentLabel(a.parent)}</span>`);
      if (a.parent==='B' && a.severityF && a.severityM) {
        badges.push(`<span class="severity-badge s${a.severityF}">♂ ${sevLabel(a.severityF)}</span>`);
        badges.push(`<span class="severity-badge s${a.severityM}">♀ ${sevLabel(a.severityM)}</span>`);
      } else if (a.severity) {
        badges.push(`<span class="severity-badge s${a.severity}">${sevLabel(a.severity)}</span>`);
      }
      return `<div class="summary-item">
        <div class="summary-id">${q.id}</div>
        <div class="summary-info">
          <div class="summary-eng">${q.eng}</div>
          <div class="summary-name">${q.title}</div>
          <div class="summary-detail">${badges.join(' ')}</div>
        </div></div>`;
    }).join('');
  }

  function diagItems() {
    if (!activeDiag.length) return '<div class="empty-note">No diagnoses selected.</div>';
    return activeDiag.map(d => `<div class="summary-item">
      <div class="summary-id" style="font-size:.65rem">${d.id}</div>
      <div class="summary-info"><div class="summary-name">${d.label}</div></div>
    </div>`).join('');
  }

  app().innerHTML = `
  <div class="header"><h1>Trauma Phenotypes</h1><div class="subtitle">AZ09 — Result <span style="opacity:.5">v0.6.1</span></div></div>
  <div class="results-card">
    <h2>Your <strong>trauma phenotype</strong></h2>
    <div class="code-display" id="codeDisplay">${code}<button class="code-copy-btn" onclick="copyCode()">Copy</button></div>
    <div class="code-legend">
      <strong>Legend:</strong> Capital letter = determinant · <code>f</code> = father · <code>m</code> = mother · <code>r</code> = reversed · digit after letter = severity · Digit pair (e.g. 03) = coping mechanism + severity · <code>s</code>+digit+severity = somatic symptom · <code>d</code>+digit = diagnosis · <code>u</code>+severity = unexplained complaints · Version number after dash
    </div>
    <div class="visual-codes">
      <div class="totem-container">
        <div class="visual-label">Totem</div>
        ${generateTotemSVG()}
      </div>
      <div class="qr-container" id="qrContainer">
        <div class="visual-label">QR Code</div>
        <canvas id="qrCanvas" width="140" height="140" style="border-radius:var(--radius-sm)"></canvas>
        <div style="font-size:.7rem;color:var(--text-light);max-width:140px;text-align:center;line-height:1.4">Scan to read your code</div>
      </div>
    </div>
  </div>
  <div class="results-card" style="margin-top:12px">
    <h2>Summary</h2>
    <div class="summary-section-title">Determinants (A–Z)</div>
    ${summaryItems(activeDet)}
    <div class="summary-section-title" style="margin-top:24px">Coping Mechanisms (0–9)</div>
    ${summaryItems(activeCop)}
    ${activeSom.length || activeDiag.length ? `
    <div class="summary-section-title" style="margin-top:24px">Somatic</div>
    ${activeSom.length ? summaryItems(activeSom) : ''}
    ${activeDiag.length ? `<div style="margin-top:12px"><div class="summary-section-title" style="font-size:.85rem">Diagnoses</div>${diagItems()}</div>` : ''}
    ` : ''}
  </div>
  <div class="results-card" style="margin-top:12px">
    <div class="suggestions-section">
      <label>General suggestions</label>
      <textarea id="suggestionsField" placeholder="Do you have feedback, comments, or suggestions? Leave them here..." oninput="state.suggestions=this.value">${state.suggestions}</textarea>
      ${Object.keys(state.qFeedback).filter(k=>state.qFeedback[k]).length ? `
      <div style="margin-top:16px">
        <label>Suggestions per question</label>
        ${Object.keys(state.qFeedback).filter(k=>state.qFeedback[k]).map(k=>{
          const qq = questions.find(q=>q.id===k);
          return `<div style="font-size:.82rem;margin-top:8px;padding:8px 12px;background:#FAFAFA;border-radius:var(--radius-sm);border:1px solid var(--border)">
            <strong style="color:var(--purple)">${k}</strong> <span style="color:var(--text-light)">${qq?qq.eng:''}</span><br>${state.qFeedback[k]}
          </div>`;
        }).join('')}
      </div>` : ''}
    </div>
    <div class="results-actions">
      <button class="btn btn-secondary" onclick="goToQuestion(0)">Adjust answers</button>
      <button class="btn btn-secondary" onclick="window.print()">Print</button>
      <button class="btn btn-primary" onclick="copyCode()">Copy code</button>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════
// EVENT HANDLERS
// ═══════════════════════════════════════════════════════════════
function resetIntroStyle() { document.body.style.background=''; app().style.maxWidth=''; app().style.padding=''; }
function startQuestions() { resetIntroStyle(); state.phase='questions'; state.currentIndex=0; state.slideDir='forward'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function startCoping() { state.phase='questions'; state.currentIndex=26; state.bubbleOpen=false; state.moreInfoOpen=false; state.slideDir='forward'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function startSomatic() { state.phase='questions'; state.currentIndex=36; state.bubbleOpen=false; state.moreInfoOpen=false; state.slideDir='forward'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function skipToResults() { state.phase='results'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function toggleDiagnosis(id) { state.diagAnswers[id]=!state.diagAnswers[id]; render(); }

function setPresent(val) {
  const q = questions[state.currentIndex];
  if (!state.answers[q.id]) state.answers[q.id] = {};
  const a = state.answers[q.id];
  if (a.present === val) return;
  a.present = val;
  if (val === false) {
    a.parent = null; a.severity = null;
    // Auto-advance with slide animation
    const card = document.getElementById('qcard');
    if (card) card.classList.add('slide-out');
    setTimeout(() => {
      state.slideDir = 'forward';
      if (state.currentIndex === 25) { state.phase='celebration'; }
      else if (state.currentIndex === 35) { state.phase='somaticTransition'; }
      else if (state.currentIndex === questions.length-1) { state.phase='diagnoses'; }
      else if (state.currentIndex < questions.length-1) { state.currentIndex++; }
      state.bubbleOpen = false;
      state.moreInfoOpen = false;
      render(); window.scrollTo({top:0,behavior:'smooth'});
    }, 260);
    return;
  }
  if (val === 'reversed' || val === true) { a.parent = null; a.severity = null; }
  render();
}

function setParent(val) {
  const q=questions[state.currentIndex];
  const a = state.answers[q.id];
  const oldParent = a.parent;
  a.parent=val;
  // Reset severity when switching to/from beiden
  if (val==='B' && oldParent!=='B') { a.severity=null; a.severityF=null; a.severityM=null; }
  if (val!=='B' && oldParent==='B') { a.severity=null; a.severityF=null; a.severityM=null; }
  render();
}
function setSeverity(val) {
  const q=questions[state.currentIndex];
  state.answers[q.id].severity=val;
  render();
  // Auto-advance after severity selection
  setTimeout(() => {
    const card = document.getElementById('qcard');
    if (card) card.classList.add('slide-out');
    setTimeout(() => {
      state.slideDir = 'forward';
      if (state.currentIndex===25) { state.phase='celebration'; }
      else if (state.currentIndex===35) { state.phase='somaticTransition'; }
      else if (state.currentIndex===questions.length-1) { state.phase='diagnoses'; }
      else if (state.currentIndex<questions.length-1) { state.currentIndex++; }
      state.bubbleOpen=false; state.moreInfoOpen=false; render(); window.scrollTo({top:0,behavior:'smooth'});
    }, 260);
  }, 350);
}

function setSeveritySplit(who, val) {
  const q=questions[state.currentIndex];
  const a = state.answers[q.id];
  if (who==='F') a.severityF=val;
  else a.severityM=val;
  // Also set combined severity to max of both (for totem/summary display)
  if (a.severityF && a.severityM) a.severity = Math.max(a.severityF, a.severityM);
  render();
  // Auto-advance only when both are set
  if (a.severityF && a.severityM) {
    setTimeout(() => {
      const card = document.getElementById('qcard');
      if (card) card.classList.add('slide-out');
      setTimeout(() => {
        state.slideDir = 'forward';
        if (state.currentIndex===25) { state.phase='celebration'; }
        else if (state.currentIndex===35) { state.phase='somaticTransition'; }
        else if (state.currentIndex===questions.length-1) { state.phase='diagnoses'; }
        else if (state.currentIndex<questions.length-1) { state.currentIndex++; }
        state.bubbleOpen=false; state.moreInfoOpen=false; render(); window.scrollTo({top:0,behavior:'smooth'});
      }, 260);
    }, 350);
  }
}

function toggleBubble() {
  state.bubbleOpen = !state.bubbleOpen;
  const content = document.getElementById('bubbleContent');
  const arrow = document.querySelector('.bubble-toggle .arrow');
  if (content) content.classList.toggle('open', state.bubbleOpen);
  if (arrow) arrow.classList.toggle('open', state.bubbleOpen);
}

function toggleHelp(btn) {
  const tip = btn.querySelector('.help-tip');
  if (tip) tip.classList.toggle('show');
}

function toggleMoreInfo() {
  state.moreInfoOpen = !state.moreInfoOpen;
  const content = document.getElementById('moreInfoContent');
  const arrow = document.querySelector('.more-info-toggle .mi-arrow');
  if (content) content.classList.toggle('open', state.moreInfoOpen);
  if (arrow) arrow.classList.toggle('open', state.moreInfoOpen);
}

function nextQuestion() {
  const q=questions[state.currentIndex];
  if (!isComplete(q.id)) return;
  const card = document.getElementById('qcard');
  if (card) card.classList.add('slide-out');
  setTimeout(() => {
    state.slideDir = 'forward';
    if (state.currentIndex===25) { state.phase='celebration'; }
    else if (state.currentIndex===35) { state.phase='somaticTransition'; }
    else if (state.currentIndex===questions.length-1) { state.phase='diagnoses'; }
    else if (state.currentIndex<questions.length-1) { state.currentIndex++; }
    state.bubbleOpen=false; state.moreInfoOpen=false; render(); window.scrollTo({top:0,behavior:'smooth'});
  }, 260);
}

function prevQuestion() {
  if (state.currentIndex>0) {
    if (state.currentIndex===26) { state.phase='celebration'; render(); return; }
    if (state.currentIndex===36) { state.phase='somaticTransition'; render(); return; }
    const card = document.getElementById('qcard');
    if (card) {
      card.style.animation = 'slideOutRight .25s ease both';
      card.style.pointerEvents = 'none';
    }
    setTimeout(() => {
      state.slideDir = 'back';
      state.currentIndex--; state.bubbleOpen=false; state.moreInfoOpen=false; render(); window.scrollTo({top:0,behavior:'smooth'});
    }, 260);
  }
}

function goToQuestion(idx) { state.phase='questions'; state.currentIndex=idx; state.bubbleOpen=false; state.moreInfoOpen=false; state.slideDir='forward'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function showResults() { state.phase='results'; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function drawQR() {
  const canvas = document.getElementById('qrCanvas');
  if (canvas) { try { QR.drawCanvas(canvas, generateCode(), 4); } catch(e) { console.warn('QR generation failed:', e); } }
}

function copyCode() {
  navigator.clipboard.writeText(generateCode()).then(()=>{
    const btn=document.querySelector('.code-copy-btn');
    if(btn){btn.textContent='Copied!';setTimeout(()=>btn.textContent='Copy',2000);}
  });
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
render();
</script>
